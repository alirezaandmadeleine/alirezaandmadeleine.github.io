html,body{margin:0;background:var(--ivory);color:var(--ink)}
body{display:grid;place-items:center;min-height:100vh;min-height:100svh;padding:40px 22px;font:17px/1.7 Jost,Futura,"Century Gothic",system-ui,sans-serif}
body.trying main{visibility:hidden}

.date{font-size:12px;line-height:1.6;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 1.4em}

.ask{margin:0}
.alt{color:var(--muted);font-size:15px;margin:.2em 0 0}
[lang=fa]{font-family:Vazirmatn,Jost,sans-serif}
form{margin:2em 0 0;display:flex;flex-direction:column;align-items:center;gap:16px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input{width:100%;height:48px;font:inherit;text-align:center;letter-spacing:.08em;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--stone);border-radius:0;padding:0 4px}

button{min-height:48px;padding:0 34px;border:0;border-radius:0;background:var(--ink);color:var(--ivory);font:400 12px/1.6 Jost,Futura,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
button:hover{background:var(--noir)}
button:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
button[disabled]{opacity:.6;cursor:wait}

.err span{display:block}

  try { saved = localStorage.getItem('am-pw'); } catch (e) { saved = null; }
  if (!window.crypto || !crypto.subtle) {
    ask(); err.innerHTML = '<span>Please open this page in an up to date browser.</span><span lang="de">Bitte öffnet die Seite in einem aktuellen Browser.</span>';
    go.disabled = true;
    return;
  }
  if (saved) unlock(saved).then(function (html) { show(html, saved); }, ask); else ask();
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = norm(input.value);
    if (!pw) return;
    go.disabled = true; err.textContent = '';
    unlock(pw).then(function (html) { show(html, pw); }, function () {
      go.disabled = false;
      err.innerHTML = '<span>This password does not seem right. Please try again.</span><span lang="de">Das Passwort stimmt leider nicht. Versucht es bitte noch einmal.</span><span lang="fa" dir="rtl">رمز عبور درست نیست. لطفاً دوباره امتحان کنید.</span>';
      input.select();
    });
  });
})();
</script>
</body>
</html>
