body{display:grid;place-items:center;min-height:100vh;min-height:100svh;padding:40px 22px;font:17px/1.7 Jost,Futura,"Century Gothic",system-ui,sans-serif}

.date{font-size:12px;line-height:1.6;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 1.4em}

.ask{margin:0}

[lang=fa]{font-family:Vazirmatn,Jost,sans-serif}
form{margin:2em 0 0;display:flex;flex-direction:column;align-items:center;gap:16px}

button:hover{background:var(--noir)}
button:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
button[disabled]{opacity:.6;cursor:wait}

.err span{display:block}
