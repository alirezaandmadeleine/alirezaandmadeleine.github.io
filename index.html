<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Alireza &amp; Madeleine, 27 May 2027</title>
<style>
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/instrument.woff2) format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/instrument-it.woff2) format("woff2")}
@font-face{font-family:Jost;font-weight:400 500;font-display:swap;src:url(fonts/jost.woff2) format("woff2")}
@font-face{font-family:Vazirmatn;font-weight:400;font-display:swap;src:url(fonts/vazir-400.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
:root{color-scheme:light;--ivory:#FEFDF8;--ink:#222120;--noir:#151413;--muted:#5E5950;--stone:#7C766C;--clay:#C58D72}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--ink)}
body{display:flex;justify-content:center;font:17px/1.7 Jost,Futura,"Century Gothic",system-ui,sans-serif;overflow-x:hidden}
main{width:100%;max-width:34rem;min-height:100vh;min-height:100svh;padding:clamp(14px,3.2vh,40px) 22px clamp(16px,3vh,36px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vh,22px);text-align:center}
.date{margin:0 0 .35em;font-size:12px;line-height:1.6;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font:400 clamp(27px,7.2vw,52px)/1.04 "Instrument Serif",Didot,"Times New Roman",serif;text-transform:uppercase;white-space:nowrap}
/* the door: its height leaves room for the names and the password, and its width never outgrows the screen */
.door{position:relative;flex:none;aspect-ratio:320/470;height:min(clamp(230px,calc(100vh - 340px),600px),calc((100vw - 44px) * 1.46875));transform-origin:50% 67%}
@supports (height:100svh){.door{height:min(clamp(230px,calc(100svh - 340px),600px),calc((100vw - 44px) * 1.46875))}}
.door .frame{position:absolute;inset:0;width:100%;height:100%;display:block}
.way{position:absolute;perspective:900px;perspective-origin:50% 45%}
.light{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 72%,#FFFDF8 0%,#F8F1E4 46%,#E7DAC4 100%)}
.leaf{position:absolute;top:0;width:50%;height:100%;display:block;transition:transform 1.35s cubic-bezier(.55,.06,.22,1);will-change:transform}
.leaf.l{left:0;transform-origin:0 50%}
.leaf.r{right:0;transform-origin:100% 50%}
.leaf .shade{transition:opacity 1.35s}
.ask-box{width:100%;max-width:24rem}
.say{display:grid}
.say>*{grid-area:1/1}
.ask{margin:0;font-size:16px;line-height:1.55}
.alt{margin:.15em 0 0;font-size:14px;line-height:1.55;color:var(--muted)}
[lang=fa]{font-family:Vazirmatn,Jost,sans-serif}
.err{margin:0;color:#8f4a33;font-size:14px;line-height:1.55;align-self:center}
.err span{display:block}
.wrong .prompts{visibility:hidden}
form{display:flex;gap:10px;margin:12px 0 0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input{flex:1;min-width:0;height:48px;font:inherit;text-align:center;letter-spacing:.08em;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--stone);border-radius:0;padding:0 4px}
input:focus{outline:none;border-bottom-color:var(--ink);box-shadow:0 1px 0 var(--ink)}
button{flex:none;min-height:48px;padding:0 28px;border:0;border-radius:0;background:var(--ink);color:var(--ivory);font:400 12px/1.6 Jost,Futura,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
button:hover{background:var(--noir)}
button:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
button[disabled]{opacity:.6;cursor:wait}
/* while a saved password is tried, the door waits closed and the password field stays away */
.trying .ask-box{visibility:hidden}
/* a wrong password: the door only gives a little */
@keyframes push-l{0%,100%{transform:none}25%{transform:rotateY(3.5deg)}55%{transform:rotateY(-.8deg)}78%{transform:rotateY(1.4deg)}}
@keyframes push-r{0%,100%{transform:none}25%{transform:rotateY(-3.5deg)}55%{transform:rotateY(.8deg)}78%{transform:rotateY(-1.4deg)}}
.wrong .leaf.l{animation:push-l .5s ease}
.wrong .leaf.r{animation:push-r .5s ease .04s}
/* the right password: the leaves swing inward, then we walk through into the light */
.open{overflow:hidden}
.open .leaf.l{transform:rotateY(82deg)}
.open .leaf.r{transform:rotateY(-82deg)}
.open .leaf .shade{opacity:.42}
.open .names,.open .ask-box{opacity:0;transition:opacity .35s}
.open .door{transform:scale(4.4);opacity:0;transition:transform .85s cubic-bezier(.6,0,.85,.45) .95s,opacity .4s ease 1.42s}
.quick .leaf,.quick .leaf .shade{transition-duration:.85s}
.quick.open .door{transition:transform .6s cubic-bezier(.6,0,.85,.45) .45s,opacity .28s ease .8s}
.fade main{opacity:0;transition:opacity .25s}
@media (prefers-reduced-motion:reduce){.wrong .leaf{animation:none}}
</style>
